# -------------------------------------------------------------
# LOCATIONS — listed best first. location_score is out of 5.
# -------------------------------------------------------------
locations:
  - name: "Croydon"
    radius_miles: 10
    location_score: 5
  - name: "Sutton"
    radius_miles: 10
    location_score: 5
  - name: "Wimbledon"
    radius_miles: 10
    location_score: 5
  - name: "South London"
    radius_miles: 10
    location_score: 4
  - name: "Central London"
    radius_miles: 10
    location_score: 3
  - name: "London"
    radius_miles: 15
    location_score: 3
  - name: "Surrey"
    radius_miles: 15
    location_score: 2

max_commute_minutes: 60
# Unusually strong roles outside the commute target are kept but flagged
allow_exceptional_outside_commute: true
exceptional_score_threshold: 85

# -------------------------------------------------------------
# SCORING — weights must add up to 100
#
# Updated 9 Aug 2026: priority is now a fast foot-in-the-door office
# role over one that maps tightly onto Project Management specifically.
# accessibility and salary carry more weight; career_transition_fit
# carries less. Change these back if that priority changes again.
# -------------------------------------------------------------
scoring_weights:
  career_transition_fit: 10
  transferable_skills: 20
  entry_level_accessibility: 30
  skills_match: 15
  salary: 15
  location: 5
  career_development: 5

priority_bands:
  must_apply: 90      # fire emoji
  high: 80
  good: 70
  stretch: 60
  # anything below `stretch` is LOW

thresholds:
  save_to_tracker: 70    # auto-add to CRM at or above this
  email_alert: 80        # individual Gmail alert at or above this
  urgent_alert: 90       # extra alert at or above this
  # Below this, no CV/cover letter gets generated — each one is a real
  # API call, so this exists to stop the system spending money on jobs
  # that were never worth applying to in the first place. Currently set
  # equal to save_to_tracker; raise it if you want materials generated
  # only for your strongest matches.
  generate_materials_minimum_score: 70

generation:
  # claude-haiku-4-5-20251001 is fast and inexpensive, appropriate for
  # structured drafting at volume. Swap to claude-sonnet-5 for higher
  # quality on your final applications if cost isn't a concern.
  model: "claude-haiku-4-5-20251001"

# -------------------------------------------------------------
# SALARY SCORING — how a job's pay maps onto the salary_score
# points in scoring_weights above. Below `floor` normally means
# the job was already filtered out; `good` and `excellent` set
# the top of the scale. Adjust these as your sense of the market
# changes — nothing else needs to change alongside them.
# -------------------------------------------------------------
salary_benchmark:
  good: 30000
  excellent: 38000

# -------------------------------------------------------------
# SCORING KEYWORDS — this is what the automated scorer actually
# reads for. It is a blunt instrument compared to a human reading
# the full advert: it counts keyword hits, nothing more. Add
# words you keep noticing in good adverts; remove ones giving
# false positives.
# -------------------------------------------------------------
scoring_keywords:
  accessibility_positive:
    - "no experience necessary"
    - "no experience required"
    - "no previous experience"
    - "training provided"
    - "full training given"
    - "full training will be given"
    - "trainee"
    - "graduate scheme"
    - "apprentice"
    - "apprenticeship"
    - "entry level"
    - "entry-level"
    - "career changer"
    - "would suit"
    - "desirable but not essential"
    - "not essential"

  accessibility_negative:
    - "years of experience essential"
    - "years experience essential"
    - "must have experience"
    - "extensive experience"
    - "proven track record"
    - "senior"
    - "minimum 3 years"
    - "minimum 5 years"
    - "minimum five years"
    - "minimum three years"

  skills_keywords:
    - "excel"
    - "microsoft office"
    - "powerpoint"
    - "outlook"
    - "word"
    - "teams"
    - "crm"
    - "reporting"
    - "data entry"
    - "data handling"
    - "scheduling"
    - "diary management"
    - "invoicing"
    - "spreadsheet"

  transferable_keywords:
    - "customer service"
    - "customer-facing"
    - "fast-paced"
    - "fast paced"
    - "under pressure"
    - "attention to detail"
    - "communication"
    - "team player"
    - "teamwork"
    - "organised"
    - "organized"
    - "organisation"
    - "multitask"
    - "deadlines"
    - "problem solving"
    - "problem-solving"
    - "reliable"
    - "flexible"

  career_fit_keywords:
    - "project"
    - "coordinator"
    - "coordination"
    - "operations"
    - "pmo"
    - "programme"
    - "program"
    - "scheme"
    - "progression"
    - "development programme"
    - "career path"

  development_keywords:
    - "training"
    - "progression"
    - "development programme"
    - "career development"
    - "structured programme"
    - "mentoring"
    - "mentor"
    - "learning and development"
    - "l&d"
    - "study support"
    - "qualification"

# -------------------------------------------------------------
# SEARCH BEHAVIOUR
# -------------------------------------------------------------
search:
  # Try 7 days first; widen only if too few results
  windows_days: [7, 14, 30]
  minimum_results_before_widening: 10
  minimum_salary: 21000  # flexed down a little from 24000 on 9 Aug 2026 — a strong foot-in-door role can still clear the bar below the old floor
  exclude_keywords:
    - "commission only"
    - "self-employed"
    - "unpaid"
    - "door to door"
    - "cold calling"
    # Added 24 Aug 2026: Adzuna's search matches loosely enough that
    # skilled-trade and professionally-regulated roles were appearing in
    # results for admin/coordinator searches — a Junior CNC Machinist and
    # a Quantity Surveyor both scored in the top 10 of a real run. These
    # have nothing to do with the target career path, so excluding them
    # outright is more honest than hoping the scorer ranks them low enough.
    - "cnc machinist"
    - "quantity surveyor"
    - "structural engineer"
    - "electrician"
    - "plumber"
    - "welder"
    - "hgv driver"
    - "lgv driver"

schedule:
  run_at_local_time: "09:00"
  timezone: "Europe/London"

sources:
  reed:
    enabled: true
  adzuna:
    enabled: true
