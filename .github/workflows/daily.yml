name: Daily job search

# GitHub Actions cron is UTC-only and often starts scheduled runs hours
# late. So the workflow triggers twice a day, and main.py lets the FIRST
# run of each UK day that starts at or after 09:00 do the search. Every
# other run that day exits straight away. (The old rule, "must start
# within 30 minutes of 09:00", rejected every run because GitHub was
# starting them around 13:00-15:00.)
on:
  schedule:
    - cron: '7 8 * * *'    # 09:07 UK during BST, 08:07 during GMT
    - cron: '7 9 * * *'    # 10:07 UK during BST, 09:07 during GMT
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Needed so the run can commit data/latest_results.md back to the repo.
permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restores the previous database so the system remembers which jobs
      # it has already seen and emailed about, and whether today's search
      # has already happened.
      - name: Restore previous database
        uses: actions/cache@v4
        with:
          path: data/
          key: job-hunter-db-${{ github.run_id }}
          restore-keys: job-hunter-db-

      # Only does anything once the GMAIL_TOKEN_JSON secret exists.
      - name: Write Gmail token from secret
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          if [ -n "$GMAIL_TOKEN_JSON" ]; then
            mkdir -p credentials
            printf '%s' "$GMAIL_TOKEN_JSON" > credentials/gmail_token.json
            echo "Gmail token written."
          else
            echo "No GMAIL_TOKEN_JSON secret yet - digest will be skipped."
          fi

      - name: Run the daily search and email digest
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_RECIPIENT_ADDRESS: ${{ secrets.GMAIL_RECIPIENT_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_TOKEN_PATH: credentials/gmail_token.json
          GOOGLE_OAUTH_CLIENT_SECRETS: credentials/gmail_oauth_client.json
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        # Manual runs from the Actions tab skip the once-a-day check.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --run
            python main.py --digest
          else
            python main.py --run --digest --scheduled
          fi

      - name: Save the results file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results-${{ github.run_number }}
          path: |
            data/latest_results.md
            logs/
          retention-days: 30
          if-no-files-found: ignore

      # Commits the results back to the repo: you can read them on GitHub,
      # and the activity stops GitHub auto-disabling the schedule after
      # 60 days. A failed push now fails the run visibly instead of being
      # hidden.
      - name: Commit results
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "actions@github.com"
          if [ -f data/latest_results.md ]; then
            git add -f data/latest_results.md
            git diff --staged --quiet || git commit -m "Daily results $(date -u +%Y-%m-%d)"
            # If you pushed a change while this run was going, GitHub refuses
            # the push. Fetch your change, put the results on top, try again.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            exit 1
          else
            echo "No results file this run (already searched today) - nothing to commit."
          fi
